[package]
name = "rust-2d-game-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.29.1"
egui_extras = { version = "0.29.1", features = ["syntect"] }
eframe = "0.29.1" # renderer of the engine UI
serde = { version = "1.0.210", features = ["derive"] }
uuid = { version = "1.7.0", features = ["v4", "serde"] }
serde_json = "1.0.128"
mlua = { version = "0.10.2", features = ["lua54", "vendored", "serialize"] }  # Lua scripting
rapier2d = "0.22.0"
rodio = "0.19.0"
rfd = "0.15.1"
image = "0.25.2"
chrono = "0.4.39"
indexmap = { version = "2.2.3", features = ["serde", "rayon"] }
rayon = "1.10.0"
lofty = "0.15.0"
sha2 = "0.10.8"
once_cell = "1.20.2"
strip-ansi-escapes = "0.1.1"

[lib]
name = "rust_2d_game_engine"
path = "src/lib.rs"
