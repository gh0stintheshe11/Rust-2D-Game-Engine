[workspace]
members = ["editor", "demo/star_catcher", "demo/hilltop_hop"]
# `cargo run` / `cargo test` at the root cover the engine and the editor;
# the demo is built and linted with `--workspace`
default-members = [".", "editor"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/gh0stintheshe11/Rust-2D-Game-Engine"

[workspace.dependencies]
egui = "0.37"
eframe = "0.37"
image = "0.25.10"
uuid = { version = "1.29", features = ["v4", "v5", "serde"] }

[package]
name = "rust-2d-game-engine"
description = "A lightweight 2D game engine with a visual editor: scenes, rapier2d physics, egui rendering, audio and Lua scripting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gamedev", "game-engine", "2d", "lua", "editor"]
categories = ["game-engines", "game-development"]
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[lib]
name = "rust_2d_game_engine"
path = "src/lib.rs"

[dependencies]
egui.workspace = true
eframe.workspace = true
image.workspace = true
uuid.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mlua = { version = "0.12.3", features = ["lua54", "vendored", "serialize"] }
rapier2d = "0.36"
rodio = "0.23"
chrono = "0.4.45"
indexmap = { version = "2.14", features = ["serde"] }
lofty = "0.25.0"
gilrs = "0.11"

# Frame-time benchmark: cargo bench --bench frame
[[bench]]
name = "frame"
harness = false
