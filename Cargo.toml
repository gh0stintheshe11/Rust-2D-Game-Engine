[package]
name = "rust-2d-game-engine"
version = "0.2.0"
edition = "2021"

[dependencies]
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["syntect"] }
eframe = "0.36.1" # renderer of the engine UI
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
serde_json = "1.0"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "serialize"] }  # Lua scripting
rapier2d = "0.35.1"
rodio = "0.22.2"
rfd = "0.17.2"
image = "0.25.10"
chrono = "0.4.45"
indexmap = { version = "2.14", features = ["serde", "rayon"] }
rayon = "1.12"
lofty = "0.25.0"
sha2 = "0.10"
strip-ansi-escapes = "0.2.1"

[lib]
name = "rust_2d_game_engine"
path = "src/lib.rs"
